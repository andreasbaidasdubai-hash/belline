# Netlify builds the public website from this repo.
#
# The repo holds both halves of Belline: the Next.js app (which needs a live
# process and runs on Railway) and the marketing site (four static pages).
# Netlify only ever builds the second — `npm run site` copies public/*.html
# into site/ with the landing page promoted to index.html.

[build]
  command = "npm run site"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

# The landing page is public/landing.html in the repo but index.html on the
# site. Anyone holding the old path should still land somewhere sensible.
[[redirects]]
  from = "/landing.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# The location landing pages' old URLs are deliberately *not* listed here.
# They are written into site/_redirects by `npm run site`, from
# src/lib/seo-redirects.ts — the same table the app's own server and
# `npm run check:seo` read. One list with three consumers; a hand-kept copy
# here would be a fourth that drifts.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # The pages load fonts from Google and nothing else — no scripts from
    # anywhere but this origin.
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; frame-ancestors 'self'"
